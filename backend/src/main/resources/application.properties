spring.application.name=medicalCenter

spring.datasource.url= ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username= ${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password= ${SPRING_DATASOURCE_PASSWORD:secretpassword}
spring.jpa.database-platform= org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto= ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql= false

app.file.upload-dir=/home/boarbyte/medical_uploads
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.jwt.secret=${JWT_SECRET}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true